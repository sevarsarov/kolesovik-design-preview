<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="description" content="Изолированный дизайн-прототип КОЛЕСОВИК. Только фиктивные данные.">
  <title>КОЛЕСОВИК — Pilot UI Design v1</title>
  <link rel="stylesheet" href="styles.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('pilot-theme')||'light'}catch{}</script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#app">К содержимому</a>
  <div class="prototype-banner"><span class="banner-dot"></span> DESIGN PROTOTYPE — NOT PRODUCTION <span class="banner-sep">·</span> Фиктивные данные</div>
  <aside class="controls collapsed" aria-label="Prototype controls">
    <div class="controls-top"><span class="control-kicker">PROTOTYPE CONTROLS</span><span class="not-product">NOT PRODUCT UI</span><button id="controls-toggle" class="icon-button controls-toggle" aria-label="Развернуть панель прототипа" aria-expanded="false">+</button></div>
    <div class="controls-body">
      <label class="control-label" for="screen-select">Экран</label>
      <select id="screen-select">
        <option value="next">01 · Next / Главная</option><option value="customer">02 · Customer / Главная</option><option value="booking">03 · Customer / Запись</option><option value="order">04 · Admin / Заказ</option><option value="shift">05 · Admin / Смена</option><option value="dialog">06 · Admin / Диалог</option>
      </select>
      <label class="control-label" for="theme-select">Тема</label>
      <select id="theme-select"><option value="light">Светлая</option><option value="dark">Тёмная</option><option value="system">Системная</option></select>
      <label class="control-label" for="state-select">Состояние</label>
      <select id="state-select"><option value="normal">Обычное</option><option value="loading">Загрузка</option><option value="empty">Пустой список</option><option value="error">Ошибка</option><option value="success">Успешно</option><option value="warning">Предупреждение</option><option value="unknown">Неизвестный исход</option><option value="readonly">Только чтение</option><option value="partial">Частичный успех</option></select>
    </div>
  </aside>
  <main id="app" tabindex="-1"></main>
  <div id="overlay-root"></div>
</body>
</html>
