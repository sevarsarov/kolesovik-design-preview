<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Плановое ТО — КОЛЕСОВИК · визуальный прототип</title>
  <link rel="stylesheet" href="styles.css">
  <script>try{const t=localStorage.getItem('maintenance-prototype-theme')||'light';document.documentElement.dataset.theme=t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t}catch{}</script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">К содержимому</a>
  <div class="prototype-tools"><span>PLANOVOE TO · DESIGN PROTOTYPE</span><button id="controls-open" type="button" aria-label="Prototype Controls" aria-controls="prototype-controls" aria-expanded="false">⚙</button></div>
  <div id="prototype-controls" class="controls-backdrop" hidden>
    <section class="controls-panel" role="dialog" aria-modal="true" aria-labelledby="controls-title" tabindex="-1">
      <div class="controls-head"><h2 id="controls-title">Prototype Controls</h2><button id="controls-close" type="button" aria-label="Закрыть controls">×</button></div>
      <p>Все автомобили, позиции ТО, товары, работы и суммы — DEMO. Это не заводской регламент, не проверенная совместимость и не действующее предложение. Личные данные и внешние запросы не используются.</p>
      <label for="state-select">Состояние</label>
      <select id="state-select">
        <option value="NO_VEHICLE">Без автомобиля</option>
        <option value="VEHICLE_SELECTED">Автомобиль выбран вручную</option>
        <option value="KNOWN_CUSTOMER_CAR">Автомобиль известен из ЛК · DEMO</option>
      </select>
      <label for="theme-select">Тема как в Pilot Next</label>
      <select id="theme-select"><option value="light">Светлая</option><option value="dark">Тёмная</option><option value="system">Системная</option></select>
      <p class="technical">Ключ состояния: <code id="technical-key">NO_VEHICLE</code></p>
      <button id="controls-hide" type="button" class="button secondary">Закрыть панель</button>
    </section>
  </div>
  <div id="app"></div>
  <div id="overlay-root"></div>
</body>
</html>
