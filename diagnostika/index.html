<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Диагностика автомобиля — КОЛЕСОВИК · визуальный прототип</title>
  <link rel="stylesheet" href="styles.css">
  <script>try{const t=localStorage.getItem('diag-prototype-theme')||'light';document.documentElement.dataset.theme=t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t}catch{}</script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">К содержимому</a>
  <div class="prototype-tools"><span>DIAGNOSTIKA v1 · LOCAL DESIGN ONLY</span><button id="controls-open" type="button" aria-label="Prototype Controls" aria-controls="prototype-controls" aria-expanded="false">⚙</button></div>
  <div id="prototype-controls" class="controls-backdrop" hidden>
    <section class="controls-panel" role="dialog" aria-modal="true" aria-labelledby="controls-title" tabindex="-1">
      <div class="controls-head"><h2 id="controls-title">Prototype Controls</h2><button id="controls-close" type="button" aria-label="Закрыть controls">×</button></div>
      <p>Два варианта композиции: основная страница и страница Подольска. Работы и суммы в них — DEMO. Внешних запросов и отправки данных нет.</p>
      <label for="state-select">Страница / состояние</label>
      <select id="state-select">
        <option value="CURRENT">Основная страница · сейчас</option>
        <option value="LOCAL_CURRENT">Подольск · сейчас</option>
      </select>
      <label for="theme-select">Тема как в Pilot Next</label>
      <select id="theme-select"><option value="light">Светлая</option><option value="dark">Тёмная</option><option value="system">Системная</option></select>
      <p class="technical">Ключ состояния: <code id="technical-key">CURRENT</code></p>
      <button id="controls-hide" type="button" class="button secondary">Закрыть панель</button>
    </section>
  </div>
  <div id="app"></div>
  <div id="overlay-root"></div>
</body>
</html>
